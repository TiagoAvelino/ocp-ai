apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-intent-internal
  namespace: customer-intent-demo
spec:
  podSelector:
    matchLabels:
      app: customer-intent-inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: customer-intent-backend
      ports:
        - protocol: TCP
          port: 8080
