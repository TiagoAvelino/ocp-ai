# Ajuste RH_AI_DOMAIN antes de aplicar (ex.: rh-ai.apps.tiago-cluster.sandbox897.opentlc.com)
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: banking77-training
  namespace: customer-intent-demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    notebooks.opendatahub.io/inject-oauth: "true"
    opendatahub.io/image-display-name: Jupyter | PyTorch | CUDA | Python 3.12
    opendatahub.io/accelerator-name: migrated-gpu
    opendatahub.io/hardware-profile: nvidia-l4-profile
    opendatahub.io/mlflow-instance: mlflow
    openshift.io/description: Treino Banking77 + MLflow + S3
    openshift.io/display-name: Banking77 Training
    notebooks.opendatahub.io/last-image-selection: "pytorch:3.4"
    notebooks.opendatahub.io/last-size-selection: Medium
spec:
  template:
    spec:
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: banking77-training
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:3.4
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/customer-intent-demo/banking77-training
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:3.4
            - name: HF_HOME
              value: /opt/app-root/src/model-cache
            - name: TRANSFORMERS_CACHE
              value: /opt/app-root/src/model-cache
            - name: MLFLOW_TRACKING_AUTH
              value: kubernetes-namespaced
            - name: PIP_CERT
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
          envFrom:
            - secretRef:
                name: customer-intent-s3-connection
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src/
            - name: shm
              mountPath: /dev/shm
            - name: trusted-ca
              mountPath: /etc/pki/tls/custom-certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
      enableServiceLinks: false
      serviceAccountName: banking77-training
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: banking77-training
        - name: shm
          emptyDir:
            medium: Memory
        - name: trusted-ca
          configMap:
            name: workbench-trusted-ca-bundle
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
            optional: true
