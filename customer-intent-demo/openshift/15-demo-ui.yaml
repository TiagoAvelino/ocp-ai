apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: customer-intent-demo-ui
  namespace: customer-intent-demo
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: customer-intent-demo-ui
  namespace: customer-intent-demo
spec:
  output:
    to:
      kind: ImageStreamTag
      name: customer-intent-demo-ui:latest
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.web
  triggers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-intent-demo-ui
  namespace: customer-intent-demo
  labels:
    app: customer-intent-demo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-intent-demo-ui
  template:
    metadata:
      labels:
        app: customer-intent-demo-ui
    spec:
      containers:
        - name: ui
          image: image-registry.openshift-image-registry.svc:5000/customer-intent-demo/customer-intent-demo-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-intent-demo-ui
  namespace: customer-intent-demo
  labels:
    app: customer-intent-demo-ui
spec:
  selector:
    app: customer-intent-demo-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: customer-intent-demo-ui
  namespace: customer-intent-demo
spec:
  to:
    kind: Service
    name: customer-intent-demo-ui
  port:
    targetPort: http
  tls:
    termination: edge
