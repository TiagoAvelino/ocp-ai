# O operador MLflow exige este nome exato para artifactRootSecret
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-artifact-connection
  namespace: customer-intent-demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    openshift.io/display-name: MLflow Artifact Storage
    opendatahub.io/connection-type: s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: tempo
  AWS_SECRET_ACCESS_KEY: supersecret
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
  AWS_S3_BUCKET: customer-intent-demo
