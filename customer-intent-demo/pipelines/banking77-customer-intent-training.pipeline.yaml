pipelineInfo:
  description: 'Pipeline reproduzivel: preparacao Banking77 (12 intencoes), baseline,
    3 fine-tunings DistilBERT em sequencia (1 GPU), selecao MLflow e publicacao do
    modelo aprovado.'
  name: banking77-customer-intent-training
root:
  dag:
    tasks:
      evaluate-and-select:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-and-select
